app-id: studio.vx.GlitchStudio
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: glitch-studio

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.OpenURI

modules:
  - name: glitch-studio
    buildsystem: simple
    build-commands:
      # Своя папка для target: исходники в проекте принадлежат root,
      # а сборка flatpak идёт от обычного пользователя.
      - export CARGO_TARGET_DIR=/run/build/gs-target
      - cargo build --release --offline
      - install -Dm755 /run/build/gs-target/release/glitch-studio /app/bin/glitch-studio
    sources:
      - type: dir
        path: .

  # AppStream-метаданные: без них flatpak не может собрать инфо о приложении.
  - name: metainfo
    buildsystem: simple
    build-commands:
      - install -Dm644 io.vx.GlitchStudio.metainfo.xml /app/share/metainfo/io.vx.GlitchStudio.metainfo.xml
      - install -Dm644 glitch-studio.desktop /app/share/applications/glitch-studio.desktop
    sources:
      - type: file
        path: io.vx.GlitchStudio.metainfo.xml
      - type: file
        path: ../../glitch-studio.desktop

  # ffmpeg живёт снаружи: собирать его в flatpak долго и он тянет за собой
  # кучу -dev пакетов, поэтому берём готовый бинарь из flathub.
  # Статическая сборка ffmpeg: собирать его из исходников внутри flatpak
  # пришлось бы час, а эта версия работает без единой зависимости.
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - install -Dm755 ffmpeg /app/bin/ffmpeg
      - install -Dm755 ffprobe /app/bin/ffprobe
    sources:
      - type: file
        path: ffmpeg
        sha256: e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99
      - type: file
        path: ffprobe
        sha256: 4f231a1960d83e403d08f7971e271707bec278a9ae18e21b8b5b03186668450d