[package]
name = "glitch-studio"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "GUI-редактор для намеренной порчи фото и видео в стиле glitchcore"
homepage = "https://github.com/vxlomshikpro/glitch-studio"
repository = "https://github.com/vxlomshikpro/glitch-studio"
license = "MIT"
readme = "README.md"

[lib]
name = "glitch_studio"
path = "src/lib.rs"

[[bin]]
name = "glitch-studio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.36"
image = "0.25"
rfd = "0.17"
rand_chacha = "0.10"
material-colors = "0.5"
directories = "6"
clap = { version = "4", features = ["derive"] }
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fast_image_resize = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1